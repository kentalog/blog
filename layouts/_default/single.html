{{ define "main" }}
<article class="article">
  <p class="date">{{ .Date.Format "2006.01.02" }}</p>
  <h1>{{ .Title }}</h1>
  {{ with .Params.tags }}<div class="tags">{{ range . }}<a class="tag" href="{{ printf "/tags/%s/" (. | urlize) | relURL }}">{{ . }}</a>{{ end }}</div>{{ end }}
  {{ with .Params.image }}<figure class="eyecatch"><img src="{{ . | relURL }}" alt="{{ $.Title }}"></figure>{{ end }}
  {{ .Content }}
</article>
{{ end }}
