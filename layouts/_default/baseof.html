<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  </head>
  <body>
    <header class="profile-header">
      <a href="{{ "/" | relURL }}" class="profile-image-link" aria-label="kentalog blog home">
        <img src="{{ "images/kentalog-profile.jpg" | relURL }}" alt="kentalog" class="profile-image">
      </a>
      <a href="{{ "/" | relURL }}" class="profile-name">kentalog</a>
      <p class="profile-bio">From Japan ☺︎</p>
      <nav class="social-icons" aria-label="SNS links">
        <a href="https://twitter.com/kentalog" aria-label="X" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://instagram.com/kentalog" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://youtube.com/@kentalog" aria-label="YouTube" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://github.com/kentalog" aria-label="GitHub" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i></a>
        <a href="https://note.com/kentalog" aria-label="note" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-note-sticky"></i></a>
        <a href="https://substack.com/@kentalog" aria-label="Substack" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-bookmark"></i></a>
        <a href="https://open.spotify.com/show/7KEjKjl03z8xk7B0f0gGoq?si=31a61154522c401c" aria-label="Podcast" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-podcast"></i></a>
      </nav>
      {{ if not .IsHome }}<a class="blog-home" href="{{ "/" | relURL }}">← Blog top</a>{{ end }}
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer>© 2026 kentalog.com All rights reserved.</footer>
  </body>
</html>
